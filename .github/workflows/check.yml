name: Check lean-ui
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: examples/package-lock.json
      - run: node scripts/check.mjs
      - run: npm ci
        working-directory: examples
      - run: npm test
        working-directory: examples
      - run: npm run build
        working-directory: examples
